name: ast-parser-smoke

on:
  pull_request:
    paths:
      - "tests/ast-parser-smoke/**"
      - ".github/workflows/ast-parser-smoke.yml"
  push:
    branches: [main]
    paths:
      - "tests/ast-parser-smoke/**"
      - ".github/workflows/ast-parser-smoke.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - name: Resolve pinned parser graph
        run: cargo tree --manifest-path tests/ast-parser-smoke/Cargo.toml
      - name: Parse Rust TypeScript Go Gleam and Dart fixtures
        run: cargo test --manifest-path tests/ast-parser-smoke/Cargo.toml --all-targets
