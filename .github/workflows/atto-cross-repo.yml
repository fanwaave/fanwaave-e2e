name: AttoLang cross-repository contract gate
on:
  push:
    branches: [dev]
    paths: ['tests/atto-contracts.e2e.mjs', 'tests/atto-execution.e2e.mjs', 'tests/atto-contract-rs/**', '.github/workflows/atto-cross-repo.yml']
  pull_request:
    paths: ['tests/atto-contracts.e2e.mjs', 'tests/atto-execution.e2e.mjs', '.github/workflows/atto-cross-repo.yml']
permissions:
  contents: read
jobs:
  atto:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: e2e
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fanwaave/fanwaave-clients
          ref: 4eee096352a714dd27487e685710827f370b260d
          path: external/fanwaave-clients
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fanwaave/fanwaave-interfaces
          ref: 4c81583c33bfab187ac4520b87f416550a4aed71
          path: external/fanwaave-interfaces
          persist-credentials: false
      - name: Verify exact candidate SHAs
        run: |
          test "$(git -C external/fanwaave-clients rev-parse HEAD)" = "4eee096352a714dd27487e685710827f370b260d"
          test "$(git -C external/fanwaave-interfaces rev-parse HEAD)" = "4c81583c33bfab187ac4520b87f416550a4aed71"
      - name: Check peer AttoLang contract bindings
        working-directory: e2e
        env:
          FANWAAVE_CLIENTS_CHECKOUT: ../external/fanwaave-clients
          FANWAAVE_INTERFACES_CHECKOUT: ../external/fanwaave-interfaces
        run: node tests/atto-contracts.e2e.mjs
# NOTE: The real compiler harness in tests/atto-execution.e2e.mjs is retained
# for a future independently reviewed, token-free mirror. The canonical
# atto-lang/atto-source.rs is PRIVATE: this GITHUB_TOKEN cannot check it out.
# Do not add credentials, skip gates, or treat static tests as compile proof.

  rust-atto:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: e2e
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fanwaave/fanwaave-clients
          ref: 4eee096352a714dd27487e685710827f370b260d
          path: external/fanwaave-clients
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fanwaave/fanwaave-interfaces
          ref: 4c81583c33bfab187ac4520b87f416550a4aed71
          path: external/fanwaave-interfaces
          persist-credentials: false
      - name: Verify exact candidate Git SHAs
        run: |
          test "$(git -C external/fanwaave-clients rev-parse HEAD)" = "4eee096352a714dd27487e685710827f370b260d"
          test "$(git -C external/fanwaave-interfaces rev-parse HEAD)" = "4c81583c33bfab187ac4520b87f416550a4aed71"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Check Rust harness formatting
        working-directory: e2e
        run: cargo fmt --manifest-path tests/atto-contract-rs/Cargo.toml --check
      - name: Run cross-repository Rust tests
        working-directory: e2e
        env:
          FANWAAVE_CLIENTS_CHECKOUT: ../external/fanwaave-clients
          FANWAAVE_INTERFACES_CHECKOUT: ../external/fanwaave-interfaces
        run: cargo test --manifest-path tests/atto-contract-rs/Cargo.toml --all-targets
      - name: Lint cross-repository Rust tests
        working-directory: e2e
        run: cargo clippy --manifest-path tests/atto-contract-rs/Cargo.toml --all-targets -- -D warnings
