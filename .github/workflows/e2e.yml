name: e2e

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm test

  ast-parser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - name: Resolve pinned parser graph
        run: cargo tree --manifest-path tests/ast-parser-smoke/Cargo.toml
      - name: Parse Rust TypeScript Go Gleam and Dart fixtures
        run: cargo test --manifest-path tests/ast-parser-smoke/Cargo.toml --all-targets
      - name: Retain resolved parser lockfile
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ast-parser-cargo-lock
          path: tests/ast-parser-smoke/Cargo.lock
          if-no-files-found: error

  ores-cli-ast-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact ores-cli AST stack head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-cli
          ref: e145b76726783cc5af31d577c5feea75635f7865
          path: tmp/ores-cli
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Verify exact source head
        working-directory: tmp/ores-cli
        run: test "$(git rev-parse HEAD)" = "e145b76726783cc5af31d577c5feea75635f7865"
      - name: Check formatting
        working-directory: tmp/ores-cli
        run: cargo fmt --all -- --check
      - name: Compile all targets
        working-directory: tmp/ores-cli
        run: cargo check --all-targets
      - name: Run source/config lint regressions
        working-directory: tmp/ores-cli
        run: cargo test --all-targets source_audit -- --nocapture
      - name: Run generated env parity regressions
        working-directory: tmp/ores-cli
        run: cargo test --all-targets generated_env -- --nocapture
      - name: Run full test suite
        working-directory: tmp/ores-cli
        run: cargo test --all-targets
