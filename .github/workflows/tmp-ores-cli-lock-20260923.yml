name: Temporary ores-cli lock resolution

on:
  push:
    branches:
      - tmp/ores-cli-lock-20260923
    paths:
      - tmp/ores-cli-lock/Cargo.toml
      - tmp/ores-cli-lock/src/lib.rs
      - .github/workflows/tmp-ores-cli-lock-20260923.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out resolver branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/ores-cli-lock-20260923

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Generate and validate lockfile
        working-directory: tmp/ores-cli-lock
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /dev/null

      - name: Commit Cargo-generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/ores-cli-lock/Cargo.lock
          test -n "$(git diff --cached --name-only)"
          git commit -m 'chore: resolve ores-cli Cargo.lock'
          git push origin HEAD:tmp/ores-cli-lock-20260923
